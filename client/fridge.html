<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge – RecipesApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/fridge.js"></script>
</head>
<body>
  <header id="app-nav" class="topbar-wrap"></header>
  <main class="container page">
    <div class="page-head">
      <h1>Your fridge</h1>
      <a class="btn btn-basil" href="recipes.html">See what you can cook</a>
    </div>
    <div class="fridge-layout">
      <section class="panel add-panel" aria-labelledby="add-title">
        <h2 id="add-title">Add an item</h2>
        <form id="add-form" novalidate>
          <div class="form-group search-box">
            <label for="item-search">Item</label>
            <input id="item-search" class="form-control" autocomplete="off" maxlength="100" placeholder="Start typing, like “eggs”">
            <div id="item-suggestions" class="suggestions" hidden></div>
          </div>
          <div class="form-row">
            <div class="form-group col-5">
              <label for="amount">Amount</label>
              <input id="amount" class="form-control" type="number" min="0" step="any" inputmode="decimal">
            </div>
            <div class="form-group col-7">
              <label for="unit">Unit</label>
              <select id="unit" class="form-control">
                <option value="items">items</option>
                <option value="lb">lb</option>
                <option value="oz">oz</option>
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="gallons">gallons</option>
                <option value="liters">liters</option>
                <option value="cups">cups</option>
                <option value="cans">cans</option>
                <option value="bottles">bottles</option>
                <option value="packs">packs</option>
                <option value="bunches">bunches</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="brand">Brand <span class="optional">(optional)</span></label>
            <input id="brand" class="form-control" maxlength="100">
          </div>
          <div class="form-group">
            <label for="expires">Use by <span class="optional">(optional)</span></label>
            <input id="expires" class="form-control" type="date">
          </div>
          <p id="add-error" class="field-error" role="alert"></p>
          <button class="btn btn-basil btn-block" type="submit">Add to fridge</button>
        </form>
      </section>
      <section class="panel" aria-labelledby="list-title">
        <div class="panel-head">
          <h2 id="list-title">What's inside</h2>
          <span id="fridge-count" class="muted"></span>
        </div>
        <div id="fridge-list"></div>
      </section>
    </div>
  </main>
</body>
</html>

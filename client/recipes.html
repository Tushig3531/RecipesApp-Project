<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cook – RecipesApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/recipe.js"></script>
</head>
<body>
  <header id="app-nav" class="topbar-wrap"></header>
  <main class="container page">
    <section class="hero">
      <h1>What can you cook tonight?</h1>
      <p class="lede">Start with what's in your fridge, or look up a dish by ingredient or name.</p>
      <div class="mode-switch" role="radiogroup" aria-label="Find recipes">
        <label><input type="radio" name="mode" value="fridge" checked><span>From my fridge</span></label>
        <label><input type="radio" name="mode" value="ingredients"><span>By ingredient</span></label>
        <label><input type="radio" name="mode" value="name"><span>By name</span></label>
      </div>
      <form id="search-form" class="search-row" role="search" hidden>
        <div class="search-box">
          <input id="search-input" class="form-control" type="search" autocomplete="off" aria-label="Search recipes" aria-controls="suggestions">
          <div id="suggestions" class="suggestions" role="listbox" hidden></div>
        </div>
        <button class="btn btn-basil" type="submit">Search</button>
      </form>
      <div class="filter-row">
        <label class="chip"><input type="checkbox" name="diet" value="vegetarian"><span>Vegetarian</span></label>
        <label class="chip"><input type="checkbox" name="diet" value="vegan"><span>Vegan</span></label>
        <label class="chip"><input type="checkbox" id="include-drinks"><span>Include drinks</span></label>
        <button id="surprise" class="link-button" type="button">Surprise me</button>
      </div>
    </section>
    <p id="result-summary" class="result-summary" aria-live="polite"></p>
    <div id="results" class="recipe-grid"></div>
    <nav id="pager" class="pager" aria-label="Result pages" hidden>
      <button id="prev" class="btn btn-quiet" type="button">Previous</button>
      <span id="page-label"></span>
      <button id="next" class="btn btn-quiet" type="button">Next</button>
    </nav>
  </main>
</body>
</html>

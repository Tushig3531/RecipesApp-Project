<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – RecipesApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-intro">
      <a class="brand" href="index.html">RecipesApp</a>
      <h1>Cook from what you already have.</h1>
      <p>Tell RecipesApp what's in your fridge. It finds recipes that use it and builds the shopping list for the rest.</p>
    </section>
    <section class="auth-side">
      <div class="auth-card">
        <h2>Log in</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <p class="form-error" role="alert"></p>
          <button class="btn btn-basil btn-block" type="submit">Log in</button>
        </form>
        <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      </div>
    </section>
  </main>
</body>
</html>

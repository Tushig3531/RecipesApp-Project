<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account – RecipesApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-intro">
      <a class="brand" href="index.html">RecipesApp</a>
      <h1>Cook from what you already have.</h1>
      <p>Keep track of your fridge, find recipes that use it up, and save the ones you love.</p>
    </section>
    <section class="auth-side">
      <div class="auth-card">
        <h2>Create an account</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" class="form-control" autocomplete="username" maxlength="80" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="password-hint">
            <p id="password-hint" class="hint">At least 8 characters.</p>
          </div>
          <p class="form-error" role="alert"></p>
          <button class="btn btn-basil btn-block" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p>
      </div>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping list – RecipesApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/shopping.js"></script>
</head>
<body>
  <header id="app-nav" class="topbar-wrap"></header>
  <main class="container page narrow">
    <div class="page-head">
      <h1>Shopping list</h1>
      <label class="store-pick">Shop at <select id="store" class="form-control"></select></label>
    </div>
    <form id="add-shopping" class="search-row">
      <input id="shopping-input" class="form-control" maxlength="200" placeholder="Add something, like “lemons”" aria-label="Add to shopping list">
      <button class="btn btn-basil" type="submit">Add</button>
    </form>
    <ul id="shopping-list" class="shopping-list"></ul>
    <div id="shopping-empty" class="empty-state" hidden>
      <h2>Your list is empty</h2>
      <p>Open a recipe and choose “Add missing items to shopping list”, or add things above.</p>
    </div>
    <button id="clear-checked" class="link-button" type="button" hidden></button>
  </main>
</body>
</html>
